# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

# Run from the nix dev shell: `nix develop`, then `goreleaser release --clean`.
#
# Gio needs cgo and the system GUI libraries on Linux. The Linux binary is
# built against nixpkgs and then patched to use the standard loader and
# library search path, so it runs on regular distros. Windows needs no cgo
# and cross-compiles. macOS needs cgo with Apple's SDK and isn't built.

version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: linux
    env:
      - CGO_ENABLED=1
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        - patchelf --set-interpreter /lib64/ld-linux-x86-64.so.2 --remove-rpath "{{ .Path }}"

  - id: windows
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -H windowsgui -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-

    ---

    Linux builds need Wayland or X11 with EGL (`libwayland`, `libxkbcommon`, `libEGL`, `libX11`, `libXcursor`); they are installed on most desktops.

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
