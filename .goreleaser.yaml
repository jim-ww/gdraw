# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

# Gio needs cgo and the system GUI libraries on Linux, so Linux binaries
# are built natively by .github/workflows/release.yml on Ubuntu. Windows
# needs no cgo and cross-compiles. macOS needs cgo with Apple's SDK and
# isn't built here.

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: linux
    env:
      - CGO_ENABLED=1
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: windows
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -H windowsgui -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-

    ---

    Linux builds need Wayland or X11 with EGL (`libwayland`, `libxkbcommon`, `libEGL`, `libX11`, `libXcursor`); they are installed on most desktops.

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
